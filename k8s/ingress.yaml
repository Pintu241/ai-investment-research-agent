apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: investment-ingress
  namespace: investment-agent
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  ingressClassName: nginx
  rules:
  - host: investment.local

    http:

      paths:

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 5000

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
          service:

            name: backend-service

            port:

              number: 5000