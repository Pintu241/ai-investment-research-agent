apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: investment-agent

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: kartikxwhyz/investment-backend:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: investment-config

        - secretRef:
            name: investment-secret

        readinessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3

        livenessProbe:
          tcpSocket:
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"