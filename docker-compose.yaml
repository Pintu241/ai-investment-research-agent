services:
    client:
        build: ./client
        container_name: investment-client
        ports:
            - "5173:5173"
        env_file:
            - ./client/.env
        depends_on:
            - server
        

    server:
        build: ./server
        container_name: investment-server
        ports:
            - "5000:5000"
        env_file:
            - ./server/.env
